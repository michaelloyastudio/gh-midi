<?xml version="1.0" encoding="UTF-8"?>
<!-- Michael Loya Studio mark. Brand red, the primary mark.
     Stroked centreline: the weight is stroke-width, currently 9.5.
     The viewBox is the centreline bounds grown by half the stroke,
     so the mark sits flush to its own box. Change stroke-width and
     grow the viewBox by the same amount on each side, or the round
     caps clip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 98.52 78.75" fill="none"
     stroke="#de0000" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.75,44.68 L19.38,44.68 L28.51,25.63 L38.31,55.82 L49.71,3.77 L64.6,73 L76.94,44.87 L92.77,44.87"/>
</svg>
