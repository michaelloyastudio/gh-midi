<?xml version="1.0" encoding="UTF-8"?>
<!-- Michael Loya Studio mark.
     Drawn as a STROKED centreline, not a filled outline, so the weight
     is one number: stroke-width below. The old file baked a 7.5 unit
     stroke into the shape, so it could not be changed without redrawing.
     The viewBox tracks the weight: it is the centreline bounds grown by
     half the stroke, so the mark sits flush to its own box. Change
     stroke-width and grow the viewBox by the same amount on each side,
     or the round caps clip. site.css depends on both numbers, in the
     bar-h token and the aspect-ratio on .nav-logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 98.52 78.75" fill="none"
     stroke="#e8e0d4" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.75,44.68 L19.38,44.68 L28.51,25.63 L38.31,55.82 L49.71,3.77 L64.6,73 L76.94,44.87 L92.77,44.87"/>
</svg>
